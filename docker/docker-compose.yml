version: '3.8'

services:
  # 1. Database Tier: PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: cloudops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudops_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cloudops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend Tier: Node.js Express API
  backend:
    build:
      context: ../app/backend
      dockerfile: Dockerfile
    container_name: cloudops-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cloudops_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudops-net

  # 3. Frontend Tier: React + Nginx Proxy
  frontend:
    build:
      context: ../app/frontend
      dockerfile: Dockerfile
    container_name: cloudops-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - cloudops-net

networks:
  cloudops-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
