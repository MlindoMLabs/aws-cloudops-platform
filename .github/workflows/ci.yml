name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # Job 1: Lint & Test Application Code
  app-checks:
    name: Application Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './app/backend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd app/backend
          npm ci

      - name: Run Linter & Tests
        run: |
          cd app/backend
          npm run test --if-present

  # Job 2: Validate Docker Build
  docker-checks:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: app-checks

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Application Image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: false
          tags: aws-cloudops-backend:test

  # Job 3: Format & Validate Terraform Code
  terraform-checks:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive terraform/

      - name: Validate Dev Environment Configuration
        run: |
          cd terraform/environments/dev
          terraform init -backend=false
          terraform validate
